name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Native core test
        run: |
          g++ -std=c++20 -O3 -Iapp/src/main/cpp \
            app/src/main/cpp/five_by_five_core.cpp \
            app/src/test/cpp/five_by_five_core_test.cpp \
            -o /tmp/cubik555-test
          /tmp/cubik555-test

      - name: Android NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Compile, unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cubikSolver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
